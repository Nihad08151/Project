<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - İmarət Blog</title>
    <!-- CSS-i olduğu kimi index-dən bura gətiririk ki, tək fayl olsun -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; color: #ffffff; }
        .signup-container { background-color: #141414; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 102, 255, 0.15); border: 1px solid #1f1f1f; width: 90%; max-width: 400px; }
        h1 { color: #3399ff; margin-bottom: 25px; font-size: 26px; font-weight: 600; text-align: center; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #a0a0a0; margin-bottom: 8px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 12px 15px; background-color: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 6px; color: #ffffff; font-size: 15px; transition: 0.3s ease; }
        input[type="email"]:focus, input[type="password"]:focus { border-color: #3399ff; box-shadow: 0 0 8px rgba(0, 102, 255, 0.2); outline: none; }
        .btn-submit { background-color: #0066ff; color: #ffffff; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer; display: block; text-align: center; width: 100%; margin-top: 10px; transition: 0.3s ease; }
        .btn-submit:hover { background-color: #0052cc; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4); }
        .action-group { margin-top: 25px; padding-top: 25px; border-top: 1px solid #2a2a2a; text-align: center; }
        .action-group span { display: block; font-size: 14px; color: #888888; margin-bottom: 15px; }
        .btn-signin { background-color: transparent; color: #3399ff; border: 1px solid #3399ff; padding: 12px; border-radius: 6px; font-size: 15px; text-decoration: none; display: block; width: 100%; transition: 0.3s ease; }
        .btn-signin:hover { background-color: rgba(0, 102, 255, 0.1); }
    </style>
</head>
<body>

    <div class="signup-container">
        <h1>Create Account</h1>

        <form id="signupForm">
            <div class="input-group">
                <label>Email address:</label>
                <input type="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
                <label>Password:</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <!-- Mesaj qutusu: Həm xətanı, həm də uğurlu nəticəni göstərəcək -->
            <p id="messageBox" style="font-size: 14px; display: none; margin-bottom: 15px; text-align: center; font-weight: 500;"></p>

            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="action-group">
            <span>Already have an account?</span>
            <a href="index.html" class="btn-signin">Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const msgBox = document.getElementById('messageBox');

            // Məlumatı Python-dakı /signup funksiyasına göndəririk
            fetch('http://127.0.0.1:5000/signup', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                msgBox.style.display = 'block';
                msgBox.textContent = data.message;

                if (data.status === 'success') {
                    // Uğurlu olsa yaşıl rənglə yaz və 2 saniyə sonra daxil ol səhifəsinə (index.html) yönləndir
                    msgBox.style.color = '#00e676';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    // Xəta olsa qırmızı rənglə yaz
                    msgBox.style.color = '#ff4d4d';
                }
            })
            .catch(error => {
                msgBox.style.display = 'block';
                msgBox.style.color = '#ff4d4d';
                msgBox.textContent = "Serverlə əlaqə qurulmadı.";
            });
        });
    </script>

</body>
</html>
